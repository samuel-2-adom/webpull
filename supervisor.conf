[program:webpull]
; ============================================================
; WebPull — Supervisor Configuration
;
; Place this file at:
;   /etc/supervisor/conf.d/webpull.conf
;
; Then run:
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start webpull
; ============================================================

; Full path to uvicorn inside your virtual environment
command=/home/ubuntu/webpull/venv/bin/uvicorn main:app --host 127.0.0.1 --port 8000 --workers 2

; Directory where main.py lives
directory=/home/ubuntu/webpull

; Run as this user (not root)
user=ubuntu

; Auto-start when supervisord starts
autostart=true

; Restart automatically if it crashes
autorestart=true

; Wait this many seconds before considering it "started"
startsecs=5

; Redirect stdout and stderr to log files
stdout_logfile=/var/log/webpull/access.log
stderr_logfile=/var/log/webpull/error.log

; Keep the last 10MB of logs, 5 backups
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5

; Environment variables — add your Groq key here
; (alternatively use a .env file in the project directory)
environment=
    GROQ_API_KEY="gsk_your_key_here",
    GROQ_MODEL="llama-3.1-8b-instant"
